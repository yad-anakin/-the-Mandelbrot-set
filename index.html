<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#000" />
<title>Fractal</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#eaeaea;overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Kufi Arabic", sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .mono{font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace}
  #canvas{display:block;cursor:crosshair;image-rendering:pixelated;touch-action:none}
  #canvas.pan{cursor:grab}
  #canvas.panning{cursor:grabbing}

  /* ---------- Minimal floating toolbar ---------- */
  #bar{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    z-index:30; display:flex; align-items:center; gap:1px;
    background:rgba(15,15,18,.55);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius:999px; padding:4px;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
    transition: opacity .25s ease, transform .25s ease;
    max-width:calc(100vw - 24px);
  }
  #bar.hidden{opacity:0; transform:translate(-50%, -120%); pointer-events:none}
  .b{
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:0;color:#cfcfcf;border-radius:999px;cursor:pointer;
    transition:.15s; padding:0; flex-shrink:0;
  }
  .b:hover{background:rgba(255,255,255,.07);color:#fff}
  .b.on{color:#000;background:#eaeaea}
  .b svg{width:16px;height:16px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
  .sep{width:1px;height:18px;background:rgba(255,255,255,.08);margin:0 2px;flex-shrink:0}
  @media (max-width: 480px){
    .b{width:30px;height:30px}
    .b svg{width:15px;height:15px}
    .sep{margin:0 1px}
  }

  /* ---------- show/hide toggle ---------- */
  #toggle{
    position:fixed; top:14px; inset-inline-end:14px; z-index:31;
    width:28px;height:28px;border-radius:50%;
    background:rgba(15,15,18,.5);border:1px solid rgba(255,255,255,.08);
    color:#aaa; display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter: blur(10px); transition:.15s;
  }
  #toggle:hover{color:#fff}
  #toggle svg{width:13px;height:13px;stroke-width:2;fill:none;stroke:currentColor}

  /* ---------- popovers ---------- */
  .pop{
    position:fixed; top:54px; left:50%;
    z-index:29; min-width:200px; max-width:calc(100vw - 24px);
    background:rgba(15,15,18,.85);
    border:1px solid rgba(255,255,255,.08); border-radius:12px;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    padding:6px; opacity:0; pointer-events:none;
    transform:translateX(-50%) translateY(-6px);
    transition: opacity .18s ease, transform .18s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  .pop.open{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0)}
  .pop .item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:8px;cursor:pointer;
    font-size:13px; color:#cfcfcf;
  }
  .pop .item:hover{background:rgba(255,255,255,.06);color:#fff}
  .pop .item.active{color:#fff}
  .pop .item.active::after{content:"";width:6px;height:6px;border-radius:50%;background:#eaeaea;margin-inline-start:auto}
  .pop .swatch{width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
  .pop .row{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:#9aa}
  .pop input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:transparent;height:18px}
  .pop input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.15);border-radius:2px}
  .pop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#eaeaea;margin-top:-5px;cursor:pointer}
  .pop input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.15);border-radius:2px}
  .pop input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#eaeaea;border:0}

  /* ---------- tiny readout ---------- */
  #info{
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    z-index:20; font-size:10.5px; color:#666;
    padding:4px 10px; border-radius:999px;
    background:rgba(15,15,18,.4); border:1px solid rgba(255,255,255,.05);
    backdrop-filter: blur(8px);
    transition: opacity .25s;
    max-width:calc(100vw - 24px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #info.hidden{opacity:0;pointer-events:none}
  #info span{margin:0 4px}
  #info b{color:#bbb;font-weight:500}
  #info .deep{color:#a78bfa}
  #info .ms{color:#7be39a}

  /* transient toast */
  #toast{
    position:fixed; top:54px; left:50%; transform:translateX(-50%) translateY(-8px);
    z-index:32; pointer-events:none; opacity:0;
    background:rgba(15,15,18,.8); border:1px solid rgba(255,255,255,.1);
    color:#eaeaea; font-size:11.5px; padding:5px 10px; border-radius:999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .25s ease, transform .25s ease;
    font-family: ui-monospace, monospace;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  button:focus, .b:focus, .item:focus{outline:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Toolbar -->
<div id="bar">
  <button class="b" id="bZin" title="+">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="b" id="bZout" title="−">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="b" id="bHand" title="Pan">
    <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11M12 11V4.5a1.5 1.5 0 0 1 3 0V11M15 11V6.5a1.5 1.5 0 0 1 3 0V13c0 4-3 7-6.5 7S5 17.5 5 14v-2.5a1.5 1.5 0 0 1 3 0V13"/></svg>
  </button>
  <span class="sep"></span>
  <button class="b" id="bFractal" title="Fractal">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
  </button>
  <button class="b" id="bPalette" title="Palette">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M12 21a3 3 0 0 1 0-6c2 0 2-2 4-2"/></svg>
  </button>
  <button class="b" id="bSettings" title="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
  </button>
  <span class="sep"></span>
  <button class="b" id="bReset" title="Reset (R)">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>
  <button class="b" id="bSave" title="Save (S)">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
  </button>
  <span class="sep"></span>
  <button class="b" id="bLang" title="Language">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
  </button>
</div>

<button id="toggle" title="Hide UI (H)">
  <svg id="toggleIcon" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<!-- Popovers -->
<div class="pop" id="popFractal"></div>
<div class="pop" id="popPalette"></div>
<div class="pop" id="popSettings">
  <div class="row"><span data-i18n="quality">Quality</span>
    <span class="mono" id="qLabel" style="margin-inline-start:auto;color:#ddd">1×</span>
  </div>
  <div class="row" style="padding-top:0">
    <input type="range" id="qRange" min="0" max="3" step="1" value="2">
  </div>
  <div class="row"><span data-i18n="iter">Iter</span>
    <span class="mono" id="bLabel" style="margin-inline-start:auto;color:#ddd">×1.00</span>
  </div>
  <div class="row" style="padding-top:0">
    <input type="range" id="boost" min="-3" max="8" step="1" value="0">
  </div>
</div>

<!-- Tiny readout -->
<div id="info" class="mono">
  <span><b id="zoomVal">1.00e+0</b> ×</span>
  <span>·</span>
  <span><b id="iterVal">256</b> i</span>
  <span>·</span>
  <span id="centerVal">-0.5, 0</span>
  <span id="deepBadge" class="deep" style="display:none"> · ∞</span>
  <span> · </span>
  <span class="ms" id="msVal">—</span>
</div>

<div id="toast"></div>

<script>
// ============================================================
// i18n
// ============================================================
const I18N = {
  ckb: {
    quality:"کوالیتی", iter:"ئایتر", q_ultra:"زۆر بەرز",
    rendering:"لە ڕێندەردایە​", rendered:"ڕێندەر تەواوبوو",
    f_mandelbrot:"ماندڵبرۆت", f_julia:"جوولیا A", f_julia2:"جوولیا B",
    f_burning:"کەشتی سووتاو", f_tricorn:"ترایکۆرن",
    p_electric:"ئەلیکترۆن", p_fire:"ئاگر", p_ice:"بەفر",
    p_rainbow:"کەلەبەرگ", p_gray:"خۆڵەمێشی", p_aurora:"ئۆرۆرا",
  },
  en: {
    quality:"Quality", iter:"Iter", q_ultra:"Ultra",
    rendering:"rendering…", rendered:"rendered",
    f_mandelbrot:"Mandelbrot", f_julia:"Julia A", f_julia2:"Julia B",
    f_burning:"Burning Ship", f_tricorn:"Tricorn",
    p_electric:"Electric", p_fire:"Fire", p_ice:"Ice",
    p_rainbow:"Rainbow", p_gray:"Gray", p_aurora:"Aurora",
  }
};
let LANG = localStorage.getItem("lang") || "ckb";
function tr(k){ return I18N[LANG][k] || k; }
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG==="ckb" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n; if (I18N[LANG][k]) el.textContent = I18N[LANG][k];
  });
  buildPopovers();
}

// ============================================================
// BigFloat fixed-point: 256 fractional bits  ->  ~76 decimal digits
// ============================================================
const BF_FRAC = 256n;
function bfFromNum(x){
  if (!isFinite(x) || x===0) return 0n;
  const sign = x<0 ? -1n : 1n;
  const ax = Math.abs(x);
  const e = Math.floor(Math.log2(ax));
  const m = ax / Math.pow(2,e);                // m in [1,2)
  const mb = BigInt(Math.round(m * 4503599627370496)); // 2^52
  const sh = BigInt(e - 52) + BF_FRAC;
  let r = sh >= 0n ? mb << sh : mb >> -sh;
  return sign * r;
}
function bfToNum(a){
  if (a === 0n) return 0;
  const neg = a < 0n;
  let x = neg ? -a : a;
  const bl = x.toString(2).length;
  let m;
  if (bl > 53){
    const sh = BigInt(bl - 53);
    m = Number(x >> sh) * Math.pow(2, Number(sh) - Number(BF_FRAC));
  } else {
    m = Number(x) * Math.pow(2, -Number(BF_FRAC));
  }
  return neg ? -m : m;
}
function bfMul(a,b){
  // truncate toward zero (avoid arithmetic-shift sign skew on negatives)
  const sa = a < 0n ? -1n : 1n, sb = b < 0n ? -1n : 1n;
  const ua = a < 0n ? -a : a,   ub = b < 0n ? -b : b;
  return sa * sb * ((ua * ub) >> BF_FRAC);
}

// ============================================================
// State
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const STATE = {
  // high-precision center as BigFloat
  Cx: bfFromNum(-0.5), Cy: bfFromNum(0),
  scale: 3.5,
  baseIter: 256, iterBoost: 0,
  fractal: 'mandelbrot', palette: 0,
  W: 0, H: 0, qual: 1, ssaa: false,
  panMode: false,
};
let renderToken = 0;

function resize(){
  // uncap DPR in Ultra mode for true retina sharpness
  const dpr = STATE.ssaa ? (window.devicePixelRatio || 1) : Math.min(window.devicePixelRatio || 1, 2);
  STATE.W = canvas.width  = Math.floor(window.innerWidth * dpr);
  STATE.H = canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  scheduleRender();
}
window.addEventListener('resize', resize);

// ============================================================
// Palettes
// ============================================================
function palette(t,type){
  let r=0,g=0,b=0;
  if (type===0){ r=9*(1-t)*t*t*t*255; g=15*(1-t)*(1-t)*t*t*255; b=8.5*(1-t)*(1-t)*(1-t)*t*255; }
  else if (type===1){ r=Math.min(255,255*Math.pow(t,0.4)); g=255*Math.pow(t,1.5); b=255*Math.pow(t,3.5); }
  else if (type===2){ r=255*Math.pow(t,3); g=255*Math.pow(t,1.4); b=Math.min(255,255*Math.pow(t,0.5)); }
  else if (type===3){ const h=(t*5)%1, s=0.85, v=t<0.02?0:1;
    const f=(n,k=(n+h*6)%6)=>v - v*s*Math.max(Math.min(k,4-k,1),0);
    r=f(5)*255; g=f(3)*255; b=f(1)*255; }
  else if (type===4){ r=g=b=255*t; }
  else if (type===5){ r=255*Math.pow(t,1.8); g=255*(0.4+0.6*Math.sin(t*3.14)); b=255*(0.6+0.4*Math.cos(t*2)); }
  return [r|0,g|0,b|0];
}

// ============================================================
// Standard float64 iteration kernels
// ============================================================
function iterate(x0,y0,maxIter,fractal){
  let x=0,y=0,x2=0,y2=0,i=0;
  if (fractal==='mandelbrot'){
    const q=(x0-0.25)*(x0-0.25)+y0*y0;
    if (q*(q+(x0-0.25))<=0.25*y0*y0) return maxIter;
    if ((x0+1)*(x0+1)+y0*y0<=0.0625) return maxIter;
    while (x2+y2<=256 && i<maxIter){ y=2*x*y+y0; x=x2-y2+x0; x2=x*x; y2=y*y; i++; }
  } else if (fractal==='julia'){
    x=x0;y=y0; const cx=-0.8, cy=0.156;
    while ((x2=x*x)+(y2=y*y)<=256 && i<maxIter){ const ny=2*x*y+cy; x=x2-y2+cx; y=ny; i++; }
  } else if (fractal==='julia2'){
    x=x0;y=y0; const cx=-0.4, cy=0.6;
    while ((x2=x*x)+(y2=y*y)<=256 && i<maxIter){ const ny=2*x*y+cy; x=x2-y2+cx; y=ny; i++; }
  } else if (fractal==='burningship'){
    while (x2+y2<=256 && i<maxIter){ y=Math.abs(2*x*y)+y0; x=x2-y2+x0; x2=x*x; y2=y*y; i++; }
  } else if (fractal==='tricorn'){
    while (x2+y2<=256 && i<maxIter){ y=-2*x*y+y0; x=x2-y2+x0; x2=x*x; y2=y*y; i++; }
  }
  if (i>=maxIter) return maxIter;
  const log_zn = Math.log(x2+y2)*0.5;
  const nu = Math.log(log_zn/Math.log(2))/Math.log(2);
  return i+1-nu;
}

// ============================================================
// Perturbation engine for Mandelbrot (deep zoom)
// ============================================================
function computeRefOrbit(Cx, Cy, maxIter){
  // BigFloat reference orbit. Returns float64 arrays of Z_n and the escape index.
  let Zx = 0n, Zy = 0n;
  const refX = new Float64Array(maxIter + 1);
  const refY = new Float64Array(maxIter + 1);
  refX[0] = 0; refY[0] = 0;
  let escapedAt = maxIter;
  for (let n = 1; n <= maxIter; n++){
    const Zx2 = bfMul(Zx, Zx);
    const Zy2 = bfMul(Zy, Zy);
    const ZxZy = bfMul(Zx, Zy);
    const newZx = Zx2 - Zy2 + Cx;
    const newZy = (ZxZy << 1n) + Cy;       // 2*Zx*Zy
    Zx = newZx; Zy = newZy;
    const zx = bfToNum(Zx), zy = bfToNum(Zy);
    refX[n] = zx; refY[n] = zy;
    if (zx*zx + zy*zy > 1e10){ escapedAt = n; break; }
  }
  return { refX, refY, len: escapedAt };
}

function pertIterate(dcx, dcy, refX, refY, refLen, maxIter){
  // δz_{n+1} = 2 Z_n δz_n + δz_n^2 + δc;  test |Z_{n+1} + δz_{n+1}|^2
  let dzx = 0, dzy = 0;
  let n = 0;
  const limit = Math.min(refLen - 1, maxIter);
  while (n < limit){
    const Zx = refX[n], Zy = refY[n];
    const a = 2*(Zx*dzx - Zy*dzy) + dzx*dzx - dzy*dzy + dcx;
    const b = 2*(Zx*dzy + Zy*dzx) + 2*dzx*dzy + dcy;
    dzx = a; dzy = b;
    n++;
    const fx = refX[n] + dzx, fy = refY[n] + dzy;
    const sq = fx*fx + fy*fy;
    if (sq > 256){
      const log_zn = Math.log(sq)*0.5;
      const nu = Math.log(log_zn/Math.log(2))/Math.log(2);
      return n + 1 - nu;
    }
  }
  // Reference escaped before pixel did, or hit maxIter
  if (refLen <= maxIter && n >= refLen - 1){
    // approximate: use reference escape value
    const fx = refX[refLen], fy = refY[refLen];
    const sq = Math.max(256.0001, fx*fx + fy*fy);
    const log_zn = Math.log(sq)*0.5;
    const nu = Math.log(log_zn/Math.log(2))/Math.log(2);
    return refLen + 1 - nu;
  }
  return maxIter;
}

// ============================================================
// Renderer (progressive blocks, dispatches to standard or perturbation)
// ============================================================
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1400);
}

async function renderProgressive(){
  const myToken = ++renderToken;
  const t0 = performance.now();
  const { W, H, scale, fractal, palette: pal, qual } = STATE;
  document.getElementById('msVal').textContent = tr('rendering');
  showToast(tr('rendering'));
  const cxN = bfToNum(STATE.Cx), cyN = bfToNum(STATE.Cy);
  const aspect = H/W;
  const dx = scale/W;
  const maxIter = Math.max(64, Math.floor(
    (STATE.baseIter + 80*Math.log2(3.5/scale + 1)) * Math.pow(1.5, STATE.iterBoost)
  ));

  // Engage perturbation for Mandelbrot when float64 starts losing precision
  const deep = (fractal === 'mandelbrot') && (scale < 1e-12);
  document.getElementById('iterVal').textContent = maxIter;
  document.getElementById('zoomVal').textContent = (3.5/scale).toExponential(2);
  // for very deep zoom, show more digits than float64 can represent
  document.getElementById('centerVal').textContent =
    deep ? bfFmt(STATE.Cx, scale) + ', ' + bfFmt(STATE.Cy, scale)
         : cxN.toFixed(8) + ', ' + cyN.toFixed(8);
  document.getElementById('deepBadge').style.display = deep ? '' : 'none';

  let ref = null;
  if (deep){
    ref = computeRefOrbit(STATE.Cx, STATE.Cy, maxIter);
    if (myToken !== renderToken) return;
  }

  const xMin = cxN - scale/2;
  const yMin = cyN - (scale*aspect)/2;
  const halfW = scale/2;
  const halfH = scale*aspect/2;

  const img = ctx.createImageData(W, H);
  const data = img.data;
  const startStep = Math.max(8, qual*4);
  const passes = [];
  for (let s=startStep; s>=qual; s=Math.max(qual, s>>1)){ passes.push(s); if (s===qual) break; }

  for (const step of passes){
    for (let py=0; py<H; py+=step){
      for (let px=0; px<W; px+=step){
        // SSAA only on the final 1px pass
        const doSSAA = STATE.ssaa && step === 1;
        // Sub-pixel offsets: 1 sample (no SSAA) or 4 samples in a 2x2 grid
        const offs = doSSAA ? [[-0.25,-0.25],[0.25,-0.25],[-0.25,0.25],[0.25,0.25]] : [[0,0]];
        let R=0,G=0,B=0;
        for (const [ox,oy] of offs){
          let it;
          if (deep){
            const dcx = (px + ox - W/2) * dx;
            const dcy = (py + oy - H/2) * dx;
            it = pertIterate(dcx, dcy, ref.refX, ref.refY, ref.len, maxIter);
          } else {
            const x0 = xMin + (px+ox)*dx;
            const y0 = yMin + (py+oy)*dx;
            it = iterate(x0,y0,maxIter,fractal);
          }
          let r,g,b;
          if (it>=maxIter){ r=g=b=0; }
          else { const t=Math.sqrt(it/maxIter); [r,g,b]=palette(t,pal); }
          R+=r; G+=g; B+=b;
        }
        const inv = 1/offs.length;
        const r=R*inv|0, g=G*inv|0, b=B*inv|0;
        const xEnd=Math.min(px+step,W), yEnd=Math.min(py+step,H);
        for (let yy=py; yy<yEnd; yy++){
          let idx=(yy*W+px)*4;
          for (let xx=px; xx<xEnd; xx++){ data[idx]=r;data[idx+1]=g;data[idx+2]=b;data[idx+3]=255; idx+=4; }
        }
      }
      if ((py & 31)===0){
        ctx.putImageData(img,0,0);
        await new Promise(r=>setTimeout(r,0));
        if (myToken!==renderToken) return;
      }
    }
    ctx.putImageData(img,0,0);
    if (myToken!==renderToken) return;
  }
  const ms = (performance.now() - t0) | 0;
  document.getElementById('msVal').textContent = ms + ' ms';
  showToast(tr('rendered') + ' · ' + ms + ' ms');
}

let renderTimer=null;
function scheduleRender(){ clearTimeout(renderTimer); renderTimer=setTimeout(renderProgressive,30); }

// pretty-print BigFloat with enough decimals to distinguish at this scale
function bfFmt(bf, scale){
  // need ~ -log10(scale) + 4 digits
  const digits = Math.max(8, Math.min(40, Math.ceil(-Math.log10(scale)) + 3));
  // use string division: bf has 256 frac bits. integer = bf >> 256, frac = bf & (2^256-1)
  const neg = bf < 0n;
  let x = neg ? -bf : bf;
  const intPart = x >> BF_FRAC;
  let frac = x - (intPart << BF_FRAC);
  let s = (neg?'-':'') + intPart.toString() + '.';
  // multiply frac by 10 repeatedly
  for (let i=0;i<digits;i++){
    frac *= 10n;
    const d = frac >> BF_FRAC;
    s += d.toString();
    frac -= d << BF_FRAC;
  }
  return s;
}

// ============================================================
// Interaction
// ============================================================
function pixelToWorldBF(px, py){
  // returns BigFloat (Cx_pixel, Cy_pixel)
  const W = window.innerWidth, H = window.innerHeight;
  const dx = STATE.scale / W;
  const dcx = bfFromNum((px - W/2) * dx);
  const dcy = bfFromNum((py - H/2) * dx);
  return [STATE.Cx + dcx, STATE.Cy + dcy];
}

function zoomAt(px, py, factor){
  // C_new = P + (C - P) * factor  ; P = pixel-world coord
  const [Px, Py] = pixelToWorldBF(px, py);
  // (C - P)*factor in BigFloat: do via float64 delta then convert
  const fFactor = bfFromNum(factor);
  STATE.Cx = Px + bfMul(STATE.Cx - Px, fFactor);
  STATE.Cy = Py + bfMul(STATE.Cy - Py, fFactor);
  STATE.scale *= factor;
  scheduleRender();
}

let dragging=false, dragStart=null, viewStart=null, moved=0;
function startDrag(x,y){ dragging=true; moved=0; dragStart={x,y}; viewStart={Cx:STATE.Cx,Cy:STATE.Cy}; canvas.classList.add('panning'); }
function moveDrag(x,y){
  if (!dragging) return;
  const dxp=x-dragStart.x, dyp=y-dragStart.y;
  moved=Math.hypot(dxp,dyp);
  const ratio = STATE.scale / window.innerWidth;
  STATE.Cx = viewStart.Cx - bfFromNum(dxp*ratio);
  STATE.Cy = viewStart.Cy - bfFromNum(dyp*ratio);
  scheduleRender();
}
function endDrag(x,y,shift){
  if (!dragging) return;
  dragging=false;
  canvas.classList.remove('panning');
  if (moved < 4 && !STATE.panMode){
    zoomAt(x, y, shift ? 2 : 0.4);
  }
}

canvas.addEventListener('mousedown', e=>startDrag(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>moveDrag(e.clientX,e.clientY));
window.addEventListener('mouseup',   e=>endDrag(e.clientX,e.clientY,e.shiftKey));
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY>0 ? 1.25 : 1/1.25);
}, {passive:false});

let touchMode=null, lastTouches=null;
canvas.addEventListener('touchstart', e=>{
  if (e.touches.length===1){ touchMode='pan'; const t=e.touches[0]; startDrag(t.clientX,t.clientY); }
  else if (e.touches.length===2){ touchMode='pinch'; lastTouches=[...e.touches].map(t=>({x:t.clientX,y:t.clientY})); dragging=false; }
}, {passive:true});
canvas.addEventListener('touchmove', e=>{
  if (touchMode==='pan' && e.touches.length===1){ const t=e.touches[0]; moveDrag(t.clientX,t.clientY); }
  else if (touchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const a=e.touches[0], b=e.touches[1];
    const cur=[{x:a.clientX,y:a.clientY},{x:b.clientX,y:b.clientY}];
    const d0=Math.hypot(lastTouches[0].x-lastTouches[1].x,lastTouches[0].y-lastTouches[1].y);
    const d1=Math.hypot(cur[0].x-cur[1].x,cur[0].y-cur[1].y);
    const mx=(cur[0].x+cur[1].x)/2, my=(cur[0].y+cur[1].y)/2;
    const factor = d0/Math.max(1,d1);
    zoomAt(mx, my, factor);
    lastTouches = cur;
  }
}, {passive:false});
canvas.addEventListener('touchend', e=>{
  if (touchMode==='pan' && e.changedTouches.length){
    const t=e.changedTouches[0]; endDrag(t.clientX,t.clientY,false);
  }
  if (e.touches.length===0) touchMode=null;
});

window.addEventListener('keydown', e=>{
  if (e.key==='r'||e.key==='R') resetView();
  else if (e.key==='+'||e.key==='=') setBoost(STATE.iterBoost+1);
  else if (e.key==='-'||e.key==='_') setBoost(STATE.iterBoost-1);
  else if (e.key==='s'||e.key==='S') savePNG();
  else if (e.key==='h'||e.key==='H') toggleUI();
  else if (e.key==='Escape') closePops();
});

// ============================================================
// Popovers
// ============================================================
const FRACTALS = [
  {id:'mandelbrot', k:'f_mandelbrot'},
  {id:'julia',      k:'f_julia'},
  {id:'julia2',     k:'f_julia2'},
  {id:'burningship',k:'f_burning'},
  {id:'tricorn',    k:'f_tricorn'},
];
const PALETTES = [
  {k:'p_electric', c:'#a78bfa'},
  {k:'p_fire',     c:'#ff7a3a'},
  {k:'p_ice',      c:'#6ee7ff'},
  {k:'p_rainbow',  c:'conic-gradient(#ff0040,#ffd166,#7be39a,#3aa8ff,#a78bfa,#ff0040)'},
  {k:'p_gray',     c:'#9aa'},
  {k:'p_aurora',   c:'linear-gradient(90deg,#1eaf7a,#a78bfa)'},
];
function buildPopovers(){
  const pf = document.getElementById('popFractal');
  pf.innerHTML='';
  FRACTALS.forEach(f=>{
    const el=document.createElement('div');
    el.className='item'+(STATE.fractal===f.id?' active':'');
    el.innerHTML=`<span>${tr(f.k)}</span>`;
    el.onclick=()=>{ setFractal(f.id); buildPopovers(); closePops(); };
    pf.appendChild(el);
  });
  const pp = document.getElementById('popPalette');
  pp.innerHTML='';
  PALETTES.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='item'+(STATE.palette===i?' active':'');
    const sw=document.createElement('span'); sw.className='swatch';
    sw.style.background = p.c;
    el.appendChild(sw);
    const lbl=document.createElement('span'); lbl.textContent=tr(p.k); el.appendChild(lbl);
    el.onclick=()=>{ STATE.palette=i; scheduleRender(); buildPopovers(); closePops(); };
    pp.appendChild(el);
  });
}
const pops = { fractal:'popFractal', palette:'popPalette', settings:'popSettings' };
function openPop(name, anchor){
  closePops();
  const el = document.getElementById(pops[name]);
  const r = anchor.getBoundingClientRect();
  // anchor under the button, clamped to viewport
  const wantLeft = r.left + r.width/2;
  el.style.left = Math.max(110, Math.min(window.innerWidth-110, wantLeft)) + 'px';
  el.classList.add('open');
}
function closePops(){ document.querySelectorAll('.pop').forEach(p=>p.classList.remove('open')); }
function togglePop(name, anchor){
  const open = document.getElementById(pops[name]).classList.contains('open');
  open ? closePops() : openPop(name, anchor);
}
document.getElementById('bFractal').onclick  = e=>togglePop('fractal',  e.currentTarget);
document.getElementById('bPalette').onclick  = e=>togglePop('palette',  e.currentTarget);
document.getElementById('bSettings').onclick = e=>togglePop('settings', e.currentTarget);
document.addEventListener('mousedown', e=>{
  if (!e.target.closest('.pop') && !e.target.closest('#bar')) closePops();
});

// ============================================================
// Actions
// ============================================================
function setFractal(f){
  STATE.fractal=f;
  if (f.startsWith('julia')){ STATE.Cx=bfFromNum(0); STATE.Cy=bfFromNum(0); STATE.scale=3.5; }
  else if (f==='burningship'){ STATE.Cx=bfFromNum(-0.5); STATE.Cy=bfFromNum(-0.5); STATE.scale=3.5; }
  else { STATE.Cx=bfFromNum(-0.5); STATE.Cy=bfFromNum(0); STATE.scale=3.5; }
  setBoost(0); scheduleRender();
}
function setBoost(v){
  STATE.iterBoost=v;
  document.getElementById('boost').value=v;
  document.getElementById('bLabel').textContent='×'+Math.pow(1.5,v).toFixed(2);
  scheduleRender();
}
function setQual(idx){
  // 0 fast(¼), 1 normal(½), 2 high(1×), 3 ultra (1× + 2×2 SSAA + uncapped DPR)
  const q = idx===0?4 : idx===1?2 : 1;
  const wasSSAA = STATE.ssaa;
  STATE.qual = q;
  STATE.ssaa = (idx === 3);
  document.getElementById('qRange').value = idx;
  const label = idx===0?'¼' : idx===1?'½' : idx===2?'1×' : tr('q_ultra');
  document.getElementById('qLabel').textContent = label;
  if (wasSSAA !== STATE.ssaa){ resize(); } else { scheduleRender(); }
}
document.getElementById('boost').oninput  = e=>setBoost(+e.target.value);
document.getElementById('qRange').oninput = e=>setQual(+e.target.value);

function resetView(){
  const f=STATE.fractal;
  if (f.startsWith('julia')){ STATE.Cx=bfFromNum(0); STATE.Cy=bfFromNum(0); }
  else if (f==='burningship'){ STATE.Cx=bfFromNum(-0.5); STATE.Cy=bfFromNum(-0.5); }
  else { STATE.Cx=bfFromNum(-0.5); STATE.Cy=bfFromNum(0); }
  STATE.scale=3.5; setBoost(0); scheduleRender();
}
function savePNG(){
  const a=document.createElement('a');
  a.download=`fractal_${STATE.fractal}_${Date.now()}.png`;
  a.href=canvas.toDataURL('image/png'); a.click();
}
document.getElementById('bReset').onclick = resetView;
document.getElementById('bSave').onclick  = savePNG;
document.getElementById('bLang').onclick  = ()=>{
  LANG = LANG==='ckb'?'en':'ckb';
  localStorage.setItem('lang', LANG);
  applyLang();
};

// zoom buttons (centered on screen)
document.getElementById('bZin').onclick  = ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 0.5);
document.getElementById('bZout').onclick = ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 2);

// hand / pan mode
const bHand = document.getElementById('bHand');
bHand.onclick = ()=>{
  STATE.panMode = !STATE.panMode;
  bHand.classList.toggle('on', STATE.panMode);
  canvas.classList.toggle('pan', STATE.panMode);
};

// ============================================================
// Hide / show UI
// ============================================================
let uiHidden = false;
function toggleUI(){
  uiHidden = !uiHidden;
  document.getElementById('bar').classList.toggle('hidden', uiHidden);
  document.getElementById('info').classList.toggle('hidden', uiHidden);
  closePops();
  document.getElementById('toggleIcon').innerHTML = uiHidden
    ? '<path d="M2 2l20 20M6.7 6.7C4 8.5 2 12 2 12s3.5 7 10 7c2 0 3.7-.6 5.2-1.5M9.9 4.2A11 11 0 0 1 12 4c6.5 0 10 7 10 7a17 17 0 0 1-3.4 4M9.5 9.5a3 3 0 0 0 4.2 4.2"/>'
    : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
}
document.getElementById('toggle').onclick = toggleUI;

// boot
applyLang();
setQual(2);
resize();
</script>
